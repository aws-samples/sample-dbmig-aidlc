decision_items:
- id: case_insensitive_collation:dbo
  kind: case_insensitive_collation
  object: dbo
  collation: SQL_Latin1_General_CP1_CI_AS
  columns: 82
  summary: '82 string column(s) use a case-insensitive collation (SQL_Latin1_General_CP1_CI_AS);
    PostgreSQL compares case-sensitively, so LIKE/=/IN/ORDER BY/unique indexes change
    behaviour. Choose: (a) citext for the columns that are searched/compared, (b)
    ICU nondeterministic collation (no LIKE before PostgreSQL 18), or (c) keep case-sensitive
    and make the application use ILIKE / lower() at the call sites.'
  app_impact: every string comparison in app code/ORM queries (EF `.Contains`/`.StartsWith`/`==`,
    JPA LIKE, raw SQL) becomes case-sensitive unless (a)/(b)
  status: open
