# dbmig-aidlc — connection file (git-ignored). Passwords come from env vars
# (${SQLSERVER_PASSWORD} / ${PG_PASSWORD}) sourced from Secrets Manager at run time.

source:
  engine: sqlserver
  version: "2022"
  host: <SQLSERVER_RDS_ENDPOINT>
  port: 1433
  database: AdventureWorks
  username: mmaadmin
  password: ${SQLSERVER_PASSWORD}

target:
  engine: postgresql
  version: "17"
  host: <AURORA_PG_CLUSTER_ENDPOINT>
  port: 5432
  database: adventureworks
  username: postgres
  password: ${PG_PASSWORD}
  default_schema: public
  sslmode: require
