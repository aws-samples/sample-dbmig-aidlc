object: vEmployeeDepartment
schema: HumanResources
type: function
notes: Current department per employee (EndDate IS NULL). Compare row count and a targeted value.
cases:
  - id: c1
    description: row count
    source_sql: "SELECT COUNT(*) FROM HumanResources.vEmployeeDepartment"
    target_sql: "SELECT COUNT(*) FROM humanresources.vemployeedepartment"
    compare: scalar
  - id: c2
    description: department for employee 1
    source_sql: "SELECT MIN(Department) FROM HumanResources.vEmployeeDepartment WHERE BusinessEntityID = 1"
    target_sql: "SELECT MIN(department) FROM humanresources.vemployeedepartment WHERE businessentityid = 1"
    compare: scalar
