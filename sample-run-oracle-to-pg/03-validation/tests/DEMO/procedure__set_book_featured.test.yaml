object: SET_BOOK_FEATURED
schema: DEMO
type: procedure
notes: >
  COMMITs in the source: non-destructive case. Book 1 has only a SYSTEM listing, so the STORE filter
  updates 0 rows on both engines.
cases:
  - id: p1
    call_source: "BEGIN DEMO.SET_BOOK_FEATURED(1, 0); END;"
    call_target: "CALL demo.set_book_featured(1, 0)"
    verify:
      - {name: featured_book1, source_sql: "SELECT SUM(is_featured) FROM DEMO.LISTINGS WHERE book_id = 1", target_sql: "SELECT sum(is_featured) FROM demo.listings WHERE book_id = 1"}
