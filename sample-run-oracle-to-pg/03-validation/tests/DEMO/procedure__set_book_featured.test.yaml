object: SET_BOOK_FEATURED
schema: DEMO
type: procedure
notes: >
  COMMITs in the source: NON-DESTRUCTIVE case only (non-existent book 999999).
cases:
  - id: f1
    call_source: "BEGIN DEMO.SET_BOOK_FEATURED(999999, 1); END;"
    call_target: "CALL demo.set_book_featured(999999, 1)"
