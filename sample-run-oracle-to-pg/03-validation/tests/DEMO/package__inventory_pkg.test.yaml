object: INVENTORY_PKG
schema: DEMO
type: function
notes: >
  Flattened to demo.inventory_pkg_*. reduce_inventory has no COMMIT, so the rollback harness makes
  it safe; real listing 1 has quantity 25. The 'Insufficient inventory' error path is not compared
  (the harness compares values/effects, not raised errors) — review manually.
cases:
  - {id: i1, source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(1, 25) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(1, 25)"}
  - {id: i2, source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(2, 4) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(2, 4)"}
  - {id: i3, source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(999999, 1) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(999999, 1)"}
  - {id: i4, source_sql: "SELECT DEMO.INVENTORY_PKG.GET_LOW_STOCK_COUNT FROM dual", target_sql: "SELECT demo.inventory_pkg_get_low_stock_count()"}
  - {id: i5, source_sql: "SELECT DEMO.INVENTORY_PKG.GET_LOW_STOCK_COUNT(100) FROM dual", target_sql: "SELECT demo.inventory_pkg_get_low_stock_count(100)"}
  - id: i6
    type: procedure
    description: reduce_inventory(listing 1, 3) — quantity 25 -> 22 and updated_on set
    call_source: "BEGIN DEMO.INVENTORY_PKG.REDUCE_INVENTORY(1, 3); END;"
    call_target: "CALL demo.inventory_pkg_reduce_inventory(1, 3)"
    verify:
      - {name: qty_listing_1, source_sql: "SELECT quantity FROM DEMO.LISTINGS WHERE id = 1", target_sql: "SELECT quantity FROM demo.listings WHERE id = 1"}
      - {name: updated_set, source_sql: "SELECT COUNT(*) FROM DEMO.LISTINGS WHERE id = 1 AND updated_on IS NOT NULL", target_sql: "SELECT count(*) FROM demo.listings WHERE id = 1 AND updated_on IS NOT NULL"}
      - {name: total_qty, source_sql: "SELECT SUM(quantity) FROM DEMO.LISTINGS", target_sql: "SELECT sum(quantity) FROM demo.listings"}
