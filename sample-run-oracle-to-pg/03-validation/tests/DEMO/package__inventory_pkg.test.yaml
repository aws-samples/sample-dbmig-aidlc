object: INVENTORY_PKG
schema: DEMO
type: function
notes: >
  Real listings 1 (qty 25), 2 (qty 3), 3 (qty 10). reduce_inventory does not COMMIT in the source, so
  its write path is tested for real (rolled back): quantity of listing 1 must drop by 2 on both engines.
  get_low_stock_count is 0 for every threshold (no STORE listings).
cases:
  - {id: i1, description: enough stock, source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(1, 5) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(1, 5)"}
  - {id: i2, description: not enough stock, source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(2, 4) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(2, 4)"}
  - {id: i3, description: boundary (equal), source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(2, 3) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(2, 3)"}
  - {id: i4, description: missing listing -> NULL (NO_DATA_FOUND from SQL), source_sql: "SELECT DEMO.INVENTORY_PKG.HAS_SUFFICIENT_INVENTORY(999999, 1) FROM dual", target_sql: "SELECT demo.inventory_pkg_has_sufficient_inventory(999999, 1)"}
  - {id: i5, description: default threshold, source_sql: "SELECT DEMO.INVENTORY_PKG.GET_LOW_STOCK_COUNT FROM dual", target_sql: "SELECT demo.inventory_pkg_get_low_stock_count()"}
  - {id: i6, source_sql: "SELECT DEMO.INVENTORY_PKG.GET_LOW_STOCK_COUNT(100) FROM dual", target_sql: "SELECT demo.inventory_pkg_get_low_stock_count(100)"}
  - id: i7
    type: procedure
    description: reduce_inventory write path on a real listing
    call_source: "BEGIN DEMO.INVENTORY_PKG.REDUCE_INVENTORY(1, 2); END;"
    call_target: "CALL demo.inventory_pkg_reduce_inventory(1, 2)"
    verify:
      - {name: listing1_qty, source_sql: "SELECT quantity FROM DEMO.LISTINGS WHERE id = 1", target_sql: "SELECT quantity FROM demo.listings WHERE id = 1"}
      - {name: listing1_updated, source_sql: "SELECT COUNT(*) FROM DEMO.LISTINGS WHERE id = 1 AND updated_on IS NOT NULL", target_sql: "SELECT count(*) FROM demo.listings WHERE id = 1 AND updated_on IS NOT NULL"}
