object: CALCULATE_DISCOUNT_PCT
schema: DEMO
type: function
notes: Pure function. Inputs from real listing prices (10.95, 13.95, 6.5) plus zero, rounding-boundary and NULL cases.
cases:
  - {id: c1, description: typical (13.95 -> 10.95), source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(13.95, 10.95) FROM dual", target_sql: "SELECT demo.calculate_discount_pct(13.95, 10.95)"}
  - {id: c2, description: zero original price returns 0, source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(0, 6.5) FROM dual", target_sql: "SELECT demo.calculate_discount_pct(0, 6.5)"}
  - {id: c3, description: rounding half away from zero (1/8 = 12.5%), source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(8, 7) FROM dual", target_sql: "SELECT demo.calculate_discount_pct(8, 7)"}
  - {id: c4, description: repeating decimal (1/3), source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(3, 2) FROM dual", target_sql: "SELECT demo.calculate_discount_pct(3, 2)"}
  - {id: c5, description: negative discount (price increase), source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(6.5, 10.95) FROM dual", target_sql: "SELECT demo.calculate_discount_pct(6.5, 10.95)"}
  - {id: c6, description: NULL input yields NULL, source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(NULL, 1) FROM dual", target_sql: "SELECT demo.calculate_discount_pct(NULL, 1)"}
