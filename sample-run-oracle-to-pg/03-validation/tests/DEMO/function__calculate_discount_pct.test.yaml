object: CALCULATE_DISCOUNT_PCT
schema: DEMO
type: function
notes: >
  Pure arithmetic (no table access). Inputs use real LISTINGS.PRICE values from the sampled
  data (10.95, 13.95, 6.5) plus the guarded zero-divisor branch and NULL propagation.
  This exercises the ROUND(numeric, 2) equivalence and the IF p_original_price = 0 guard.
cases:
  - id: c1
    description: real price pair 10.95 -> 6.5 (typical discount)
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(10.95, 6.5) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(10.95, 6.5)"
    compare: scalar
  - id: c2
    description: real price pair 13.95 -> 10.95
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(13.95, 10.95) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(13.95, 10.95)"
    compare: scalar
  - id: c3
    description: boundary — zero original price hits the divide-by-zero guard, returns 0
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(0, 6.5) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(0, 6.5)"
    compare: scalar
  - id: c4
    description: no discount — same price both sides, expect 0
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(10.95, 10.95) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(10.95, 10.95)"
    compare: scalar
  - id: c5
    description: rounding behaviour — 1/3-style repeating decimal must round identically to 2dp
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(3, 1) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(3, 1)"
    compare: scalar
  - id: c6
    description: edge — negative discount (price increased) must not be clamped
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(6.5, 10.95) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(6.5, 10.95)"
    compare: scalar
  - id: c7
    description: NULL input — NULL must propagate identically (not become 0)
    source_sql: "SELECT DEMO.CALCULATE_DISCOUNT_PCT(NULL, 6.5) FROM dual"
    target_sql: "SELECT demo.calculate_discount_pct(NULL, 6.5)"
    compare: scalar
