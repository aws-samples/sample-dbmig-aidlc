object: GET_CUSTOMER_FULL_NAME
schema: DEMO
type: function
notes: >
  Real customers 1..3. No customer has a NULL name part in the source, so the coalesce path
  (Oracle '||' treats NULL as '', baseline Behavior differences) is covered by c4 over all rows only
  if such rows existed; c3 covers NO_DATA_FOUND.
cases:
  - {id: c1, source_sql: "SELECT DEMO.GET_CUSTOMER_FULL_NAME(1) FROM dual", target_sql: "SELECT demo.get_customer_full_name(1)"}
  - {id: c2, source_sql: "SELECT DEMO.GET_CUSTOMER_FULL_NAME(3) FROM dual", target_sql: "SELECT demo.get_customer_full_name(3)"}
  - {id: c3, description: missing customer, source_sql: "SELECT DEMO.GET_CUSTOMER_FULL_NAME(999999) FROM dual", target_sql: "SELECT demo.get_customer_full_name(999999)"}
  - id: c4
    description: aggregate over every customer (length checksum)
    source_sql: "SELECT SUM(LENGTH(DEMO.GET_CUSTOMER_FULL_NAME(id))) FROM DEMO.CUSTOMERS"
    target_sql: "SELECT sum(length(demo.get_customer_full_name(id))) FROM demo.customers"
