object: ARCHIVE_OLD_ORDERS
schema: DEMO
type: procedure
notes: >
  COMMITs in the source: NON-DESTRUCTIVE case only (p_days_old 100000 -> cutoff centuries ago, nothing deleted). LOW_COVERAGE: ORDERS empty in the source.
cases:
