object: VALIDATION_PKG
schema: DEMO
type: function
notes: pure functions; real emails/ISBNs from CUSTOMERS/BOOKS plus edge cases (hyphens stripped by the 'g' regexp_replace, NULL, bounds).
cases:
  - id: v1
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_EMAIL('john.doe@example.com') FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_email('john.doe@example.com')"
  - id: v2
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_EMAIL('not-an-email') FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_email('not-an-email')"
  - id: v3
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_ISBN('9780385534635') FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_isbn('9780385534635')"
  - id: v4
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_ISBN('978-0-525-62078-5') FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_isbn('978-0-525-62078-5')"
  - id: v5
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_ISBN('abc') FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_isbn('abc')"
  - id: v6
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_ISBN(NULL) FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_isbn(NULL)"
  - id: v7
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_PRICE(10.95) FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_price(10.95)"
  - id: v8
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_PRICE(10000) FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_price(10000)"
  - id: v9
    type: function
    source_sql: "SELECT DEMO.VALIDATION_PKG.IS_VALID_PRICE(0) FROM dual"
    target_sql: "SELECT demo.validation_pkg_is_valid_price(0)"
  - id: v10
    type: function
    source_sql: "SELECT NVL(SUM(DEMO.VALIDATION_PKG.IS_VALID_EMAIL(email)),0) FROM DEMO.CUSTOMERS"
    target_sql: "SELECT coalesce(sum(demo.validation_pkg_is_valid_email(email)),0) FROM demo.customers"
  - id: v11
    type: function
    source_sql: "SELECT NVL(SUM(DEMO.VALIDATION_PKG.IS_VALID_ISBN(isbn)),0) FROM DEMO.BOOKS"
    target_sql: "SELECT coalesce(sum(demo.validation_pkg_is_valid_isbn(isbn)),0) FROM demo.books"
