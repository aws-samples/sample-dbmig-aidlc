object: PROCESS_CUSTOMER_OFFER
schema: DEMO
type: procedure
notes: >
  COMMITs in the source: NON-DESTRUCTIVE case only (non-existent listing 999999 -> 0 rows updated).
  The APPROVE/REJECT update paths on real rows need manual review.
cases:
  - id: p1
    call_source: "BEGIN DEMO.PROCESS_CUSTOMER_OFFER(999999, 'APPROVE', 1, 'test'); END;"
    call_target: "CALL demo.process_customer_offer(999999, 'APPROVE', 1, 'test')"
    verify:
      - {name: store_listings, source_sql: "SELECT COUNT(*) FROM DEMO.LISTINGS WHERE listing_type = 'STORE'", target_sql: "SELECT count(*) FROM demo.listings WHERE listing_type = 'STORE'"}
