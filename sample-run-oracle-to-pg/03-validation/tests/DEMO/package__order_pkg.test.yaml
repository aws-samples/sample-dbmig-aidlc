object: ORDER_PKG
schema: DEMO
type: procedure
notes: >
  PARTIAL coverage: ORDERS / ORDER_ITEMS are empty in the source, so reads return 0; the write
  cases create rows inside the rolled-back transaction (no COMMIT in either engine). Real data:
  customers 1..3, listing 1 (book 1, 10.95), listing 2 (13.95). create_order is a FUNCTION that
  inserts, so it is invoked from a block (Oracle forbids DML in a SELECTed function).
cases:
  - {id: o1, type: function, source_sql: "SELECT DEMO.ORDER_PKG.CALCULATE_ORDER_TOTAL(999999) FROM dual", target_sql: "SELECT demo.order_pkg_calculate_order_total(999999)"}
  - {id: o2, type: function, source_sql: "SELECT DEMO.ORDER_PKG.GET_CUSTOMER_ORDER_COUNT(1) FROM dual", target_sql: "SELECT demo.order_pkg_get_customer_order_count(1)"}
  - id: o3
    description: create_order(customer 1) -> one PENDING order with total 0
    call_source: "DECLARE v NUMBER; BEGIN v := DEMO.ORDER_PKG.CREATE_ORDER(1, NULL); END;"
    call_target: "SELECT demo.order_pkg_create_order(1, NULL)"
    verify:
      - {name: pending_cust1, source_sql: "SELECT COUNT(*) FROM DEMO.ORDERS WHERE customer_id = 1 AND status = 'PENDING' AND total_amount = 0", target_sql: "SELECT count(*) FROM demo.orders WHERE customer_id = 1 AND status = 'PENDING' AND total_amount = 0"}
  - id: o4
    description: create an order for customer 2 then add 2 x listing 1 -> item row, order total 21.90
    call_source: "DECLARE v NUMBER; BEGIN v := DEMO.ORDER_PKG.CREATE_ORDER(2, NULL); DEMO.ORDER_PKG.ADD_ORDER_ITEM(v, 1, 2); END;"
    call_target: "DO $$ DECLARE v numeric; BEGIN v := demo.order_pkg_create_order(2, NULL); CALL demo.order_pkg_add_order_item(v, 1, 2); END $$"
    verify:
      - {name: items, source_sql: "SELECT COUNT(*) FROM DEMO.ORDER_ITEMS", target_sql: "SELECT count(*) FROM demo.order_items"}
      - {name: total_cust2, source_sql: "SELECT NVL(SUM(total_amount),0) FROM DEMO.ORDERS WHERE customer_id = 2", target_sql: "SELECT coalesce(sum(total_amount),0) FROM demo.orders WHERE customer_id = 2"}
      - {name: item_price, source_sql: "SELECT NVL(SUM(book_price*quantity),0) FROM DEMO.ORDER_ITEMS", target_sql: "SELECT coalesce(sum(book_price*quantity),0) FROM demo.order_items"}
  - id: o5
    description: create an order for customer 3 then set SHIPPED -> shipped_date set, others NULL
    call_source: "DECLARE v NUMBER; BEGIN v := DEMO.ORDER_PKG.CREATE_ORDER(3, NULL); DEMO.ORDER_PKG.UPDATE_ORDER_STATUS(v, 'SHIPPED'); END;"
    call_target: "DO $$ DECLARE v numeric; BEGIN v := demo.order_pkg_create_order(3, NULL); CALL demo.order_pkg_update_order_status(v, 'SHIPPED'); END $$"
    verify:
      - {name: shipped, source_sql: "SELECT COUNT(*) FROM DEMO.ORDERS WHERE customer_id = 3 AND status = 'SHIPPED' AND shipped_date IS NOT NULL AND delivered_date IS NULL AND cancelled_date IS NULL", target_sql: "SELECT count(*) FROM demo.orders WHERE customer_id = 3 AND status = 'SHIPPED' AND shipped_date IS NOT NULL AND delivered_date IS NULL AND cancelled_date IS NULL"}
