object: ORDER_PKG
schema: DEMO
type: function
notes: >
  ORDERS/ORDER_ITEMS are empty in the source, so the write paths create their own rows inside the
  rolled-back transaction: create_order (o3), create + add_order_item on real listing 1 (o4, total =
  10.95 * 2), create + update_order_status SHIPPED (o5). Identity values differ by engine, so probes
  compare counts and amounts, not ids.
cases:
  - {id: o1, source_sql: "SELECT DEMO.ORDER_PKG.CALCULATE_ORDER_TOTAL(999999) FROM dual", target_sql: "SELECT demo.order_pkg_calculate_order_total(999999)"}
  - {id: o2, source_sql: "SELECT DEMO.ORDER_PKG.GET_CUSTOMER_ORDER_COUNT(2) FROM dual", target_sql: "SELECT demo.order_pkg_get_customer_order_count(2)"}
  - id: o3
    type: procedure
    description: create_order inserts one PENDING order
    call_source: "DECLARE o NUMBER; BEGIN o := DEMO.ORDER_PKG.CREATE_ORDER(2, 1); END;"
    call_target: "SELECT demo.order_pkg_create_order(2, 1)"
    verify:
      - {name: pending_orders_c2, source_sql: "SELECT COUNT(*) FROM DEMO.ORDERS WHERE customer_id = 2 AND status = 'PENDING' AND total_amount = 0", target_sql: "SELECT count(*) FROM demo.orders WHERE customer_id = 2 AND status = 'PENDING' AND total_amount = 0"}
  - id: o4
    type: procedure
    description: create_order + add_order_item updates the order total
    call_source: "DECLARE o NUMBER; BEGIN o := DEMO.ORDER_PKG.CREATE_ORDER(2, 1); DEMO.ORDER_PKG.ADD_ORDER_ITEM(o, 1, 2); END;"
    call_target: "DO $$ DECLARE o numeric; BEGIN o := demo.order_pkg_create_order(2, 1); CALL demo.order_pkg_add_order_item(o, 1, 2); END $$"
    verify:
      - {name: items_listing1, source_sql: "SELECT COUNT(*) FROM DEMO.ORDER_ITEMS WHERE listing_id = 1 AND quantity = 2", target_sql: "SELECT count(*) FROM demo.order_items WHERE listing_id = 1 AND quantity = 2"}
      - {name: total_c2, source_sql: "SELECT NVL(SUM(total_amount),0) FROM DEMO.ORDERS WHERE customer_id = 2", target_sql: "SELECT coalesce(sum(total_amount),0) FROM demo.orders WHERE customer_id = 2"}
  - id: o5
    type: procedure
    description: update_order_status SHIPPED sets shipped_date only
    call_source: "DECLARE o NUMBER; BEGIN o := DEMO.ORDER_PKG.CREATE_ORDER(3, 1); DEMO.ORDER_PKG.UPDATE_ORDER_STATUS(o, 'SHIPPED'); END;"
    call_target: "DO $$ DECLARE o numeric; BEGIN o := demo.order_pkg_create_order(3, 1); CALL demo.order_pkg_update_order_status(o, 'SHIPPED'); END $$"
    verify:
      - {name: shipped_c3, source_sql: "SELECT COUNT(*) FROM DEMO.ORDERS WHERE customer_id = 3 AND status = 'SHIPPED' AND shipped_date IS NOT NULL AND delivered_date IS NULL", target_sql: "SELECT count(*) FROM demo.orders WHERE customer_id = 3 AND status = 'SHIPPED' AND shipped_date IS NOT NULL AND delivered_date IS NULL"}
