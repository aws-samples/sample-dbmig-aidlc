object: GET_CUSTOMER_LIFETIME_VALUE
schema: DEMO
type: function
notes: >
  Aggregates ORDERS.TOTAL_AMOUNT for a customer, excluding status 'CANCELLED'.
  ORDERS is empty in the migrated data (0 rows, verified by reconciliation), so every
  case exercises the SUM-over-empty-set path — precisely where Oracle NVL(...,0) and
  PostgreSQL coalesce(...,0) must agree that the answer is 0 and NOT NULL. Customer ids
  1..3 are the real rows; 999999 is a non-existent customer.
cases:
  - id: c1
    description: real customer 1 — no orders, must be 0 (not NULL) via NVL/coalesce
    source_sql: "SELECT DEMO.GET_CUSTOMER_LIFETIME_VALUE(1) FROM dual"
    target_sql: "SELECT demo.get_customer_lifetime_value(1)"
    compare: scalar
  - id: c2
    description: real customer 2 — no orders, must be 0
    source_sql: "SELECT DEMO.GET_CUSTOMER_LIFETIME_VALUE(2) FROM dual"
    target_sql: "SELECT demo.get_customer_lifetime_value(2)"
    compare: scalar
  - id: c3
    description: real customer 3 — no orders, must be 0
    source_sql: "SELECT DEMO.GET_CUSTOMER_LIFETIME_VALUE(3) FROM dual"
    target_sql: "SELECT demo.get_customer_lifetime_value(3)"
    compare: scalar
  - id: c4
    description: non-existent customer — aggregate over empty set still returns 0
    source_sql: "SELECT DEMO.GET_CUSTOMER_LIFETIME_VALUE(999999) FROM dual"
    target_sql: "SELECT demo.get_customer_lifetime_value(999999)"
    compare: scalar
  - id: c5
    description: NULL customer id — aggregate matches no rows, must return 0
    source_sql: "SELECT DEMO.GET_CUSTOMER_LIFETIME_VALUE(NULL) FROM dual"
    target_sql: "SELECT demo.get_customer_lifetime_value(NULL)"
    compare: scalar
