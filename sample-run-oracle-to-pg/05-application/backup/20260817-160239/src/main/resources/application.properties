# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@//oracle-source.example.com:1521/ORCL
spring.datasource.username=demo
spring.datasource.password=<REDACTED>
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate Configuration for Oracle
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# SQL Initialization
#spring.sql.init.mode=always@
#spring.sql.init.schema-locations=classpath:schema_oracle.sql
#spring.sql.init.data-locations=classpath:data_oracle.sql
#spring.sql.init.continue-on-error=true

# Server Configuration
server.port=8888
server.servlet.context-path=/demoapp

# Handle X-Forwarded-* headers from CloudFront/proxy
server.forward-headers-strategy=native

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.bobsusedbooks=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
# logging.file.name=/tmp/bobsusedbooks.log

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
