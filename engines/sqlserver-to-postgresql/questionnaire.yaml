# Round 1 policy questions for SQL Server -> PostgreSQL (field reference: engines/_common/questionnaire.yaml).
version: 1
sections:
  - id: "7"
    title: Conversion policies — SQL Server to PostgreSQL
    note: >-
      These answers set conversion defaults so fewer questions come up later. Leave a
      question blank to take the recommended option. Anything not covered here is still
      asked when it is found.
    questions:
      - id: Q7.1
        key: case_insensitive
        optional: true
        text: "SQL Server compares strings case-insensitively by default (_CI_ collations). On PostgreSQL:"
        options:
          - {id: A, recommended: true, label: "citext for the columns that are searched or compared",
             guidance: "Use citext for string columns with a _CI_ collation that are compared, searched, joined or uniquely indexed; plain varchar/text elsewhere. CREATE EXTENSION citext.",
             resolves: {case_insensitive_collation: citext}}
          - {id: B, label: "ICU nondeterministic collation (no LIKE before PostgreSQL 18)",
             guidance: "Create a nondeterministic ICU collation (und-u-ks-level2) and apply it to _CI_ columns; LIKE on them needs PostgreSQL 18+.",
             resolves: {case_insensitive_collation: icu}}
          - {id: C, label: "Keep case-sensitive; the application uses ILIKE / lower()",
             guidance: "Keep text case-sensitive; rewrite comparisons in converted code with lower()/ILIKE and add lower() expression indexes where needed.",
             resolves: {case_insensitive_collation: app}}
        writes_to: [policy]
      - id: Q7.2
        key: identity
        optional: true
        text: IDENTITY columns
        options:
          - {id: A, recommended: true, label: "GENERATED BY DEFAULT AS IDENTITY (allows explicit values in loads)",
             guidance: "Map IDENTITY to GENERATED BY DEFAULT AS IDENTITY with the source seed/increment."}
          - {id: B, label: "GENERATED ALWAYS AS IDENTITY (stricter)",
             guidance: "Map IDENTITY to GENERATED ALWAYS AS IDENTITY; loads use OVERRIDING SYSTEM VALUE."}
        writes_to: [policy]
      - id: Q7.3
        key: datetime
        optional: true
        text: datetime / smalldatetime columns
        options:
          - {id: A, recommended: true, label: "timestamp(3) (datetime has ~3 ms precision)",
             guidance: "Map datetime to timestamp(3), smalldatetime to timestamp(0), datetime2(n) to timestamp(n), datetimeoffset to timestamptz."}
          - {id: B, label: "timestamp (6 digits)", guidance: "Map datetime and datetime2 to timestamp (microseconds)."}
        writes_to: [policy]
      - id: Q7.4
        key: money
        optional: true
        text: money / smallmoney columns
        options:
          - {id: A, recommended: true, label: "numeric(19,4)", guidance: "Map money to numeric(19,4) and smallmoney to numeric(10,4)."}
          - {id: B, label: "PostgreSQL money type", guidance: "Map money to the PostgreSQL money type (locale-dependent formatting)."}
        writes_to: [policy]
      - id: Q7.5
        key: bit
        optional: true
        text: bit columns
        options:
          - {id: A, recommended: true, label: "boolean", guidance: "Map bit to boolean; convert 0/1 literals in code to false/true."}
          - {id: B, label: "smallint (the application treats them as 0/1 numbers)",
             guidance: "Map bit to smallint with CHECK (col IN (0,1)); keep 0/1 literals."}
        writes_to: [policy]
      - id: Q7.6
        key: result_sets
        optional: true
        text: Procedures that return result sets (SELECT at the end of a procedure)
        options:
          - {id: A, recommended: true, label: "Functions returning TABLE / SETOF (one result set)",
             guidance: "Convert a procedure that returns one result set to a function RETURNS TABLE(...); procedures with several result sets return refcursors."}
          - {id: B, label: "Procedures with INOUT refcursor parameters",
             guidance: "Convert result-set procedures to procedures with INOUT refcursor parameters, one per result set."}
        writes_to: [policy]
      - id: Q7.7
        key: cross_database
        optional: true
        text: Cross-database references (OtherDb.dbo.Table)
        options:
          - {id: A, recommended: true, label: "Merge the referenced databases as schemas in one PostgreSQL database",
             guidance: "Treat OtherDb.dbo.X as schema otherdb (or otherdb_dbo) in the same PostgreSQL database."}
          - {id: B, label: "postgres_fdw foreign tables", guidance: "Reach other databases through postgres_fdw foreign tables in a dedicated schema."}
        writes_to: [policy]
      - id: Q7.8
        key: agent_jobs
        optional: true
        text: SQL Server Agent jobs
        options:
          - {id: A, recommended: true, label: "pg_cron in the target database", guidance: "Convert SQL Agent jobs to pg_cron schedules calling the converted procedures."}
          - {id: B, label: "External scheduler (for example Amazon EventBridge Scheduler)",
             guidance: "Do not convert SQL Agent jobs into the database; list each job and its steps in the conversion log for an external scheduler."}
        writes_to: [policy]
